name: CodeQL
on:
  push:
    branches: [main, vapor5]
  pull_request:
    branches: [main, vapor5]
  schedule:
    - cron: '0 0 * * 1'

# Swift analysis is off until CodeQL supports Swift 6.4, which Vapor 5 requires.
# See https://codeql.github.com/docs/codeql-overview/supported-languages-and-frameworks/
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:${{matrix.language}}"
